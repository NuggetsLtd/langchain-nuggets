[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langchain-nuggets"
version = "1.1.1"
description = "Nuggets authority middleware for LangChain / LangGraph"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
keywords = ["langchain", "langgraph", "nuggets", "authority", "middleware", "trust", "ai", "agents"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "langchain-core>=0.3.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "PyJWT[crypto]>=2.8.0",
]

[project.optional-dependencies]
langgraph = [
    "langgraph-sdk>=0.1.0",
]
agent = [
    # langchain 1.x requires Python >=3.10; marker keeps the extra resolvable
    # (a no-op) on 3.9 so `pip install langchain-nuggets[agent]` never errors.
    "langchain>=1.0; python_version >= '3.10'",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.22.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "langgraph-sdk>=0.1.0",
    "PyJWT[crypto]>=2.8.0",
]

[project.urls]
Homepage = "https://nuggets.life"
Repository = "https://github.com/NuggetsLtd/langchain-nuggets"
Changelog = "https://github.com/NuggetsLtd/langchain-nuggets/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["langchain_nuggets"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.9"
strict = true
