name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    defaults:
      run:
        working-directory: packages/python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: packages/python/pyproject.toml
      - name: Install
        # The [agent] extra pulls langchain>=1.0, which requires Python >=3.10.
        # On 3.9 the AgentMiddleware adapter tests skip via pytest.importorskip.
        run: |
          if [ "${{ matrix.python-version }}" = "3.9" ]; then
            pip install -e ".[dev,langgraph]"
          else
            pip install -e ".[dev,langgraph,agent]"
          fi
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest

  js:
    name: JS tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["20", "22"]
    defaults:
      run:
        working-directory: packages/js
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: packages/js/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Audit production dependencies
        # Gate the shipped supply chain deterministically. Dev-only advisories
        # (build/test tooling) are handled by Dependabot, not this gate, so an
        # unrelated dev advisory can't block a PR. Runs once (not per matrix leg).
        if: matrix.node-version == '22'
        run: npm audit --omit=dev --audit-level=low

  audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install package + pip-audit
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -e ".[langgraph]"
          pip install pip-audit
      - name: Audit dependencies
        # pip-audit scans the whole environment. We upgrade pip/setuptools above
        # so a stale runner toolchain doesn't trip the gate, and --skip-editable
        # omits our own editable package (not on a vuln DB). Everything else,
        # including the upgraded toolchain, is still audited.
        run: pip-audit --progress-spinner off --skip-editable
