name: Release npm

on:
  push:
    tags:
      - "js-v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Publish @nuggetslife/langchain
        working-directory: packages/js
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@nuggetslife/langchain@$VERSION" version >/dev/null 2>&1; then
            echo "Already published @nuggetslife/langchain@$VERSION — skipping."
          else
            pnpm publish --access public --no-git-checks --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @nuggetslife/mcp-server
        working-directory: packages/mcp-server
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@nuggetslife/mcp-server@$VERSION" version >/dev/null 2>&1; then
            echo "Already published @nuggetslife/mcp-server@$VERSION — skipping."
          else
            pnpm publish --access public --no-git-checks --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
